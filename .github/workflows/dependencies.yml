name: Dependency health

on:
  schedule:
    - cron: "9 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  update:
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rvben/upd/.github/workflows/dependency-health.yml@c3215394f3c07a0252e9c759eb23c8b83072f7b2 # v0.16.0
    with:
      langs: rust,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt &&
        rustup default 1.96.0 &&
        go install github.com/jdx/jactionlint/v2/cmd/jactionlint@v2.1.0 &&
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Use the repository validator, which supports release concurrency.queue.
      validate-actions: false
      validation-command: make lint-actions check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
